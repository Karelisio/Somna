name: Android

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Compute version
        id: version
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          else
            NAME="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version $NAME (code ${GITHUB_RUN_NUMBER})"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/somna-release.jks"
            echo "SOMNA_KEYSTORE_PATH=$RUNNER_TEMP/somna-release.jks" >> "$GITHUB_ENV"
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant : une release doit toujours être signée avec le même keystore."
            exit 1
          else
            echo "::warning::Pas de keystore : l'APK sera non signé."
          fi

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          SOMNA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SOMNA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SOMNA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PversionCode=${{ steps.version.outputs.code }} -PversionName=${{ steps.version.outputs.name }} --stacktrace

      - name: Collect APK
        id: apk
        run: |
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          DEST="somna-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          if [ -n "${SOMNA_KEYSTORE_PATH:-}" ]; then
            "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs "$DEST" | head -n 3
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: somna-${{ steps.version.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Build changelog
        if: env.IS_TAG == 'true'
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          # 1) Section "## [x.y.z]" or "## x.y.z" of CHANGELOG.md, 2) otherwise commits since the previous tag.
          if [ -f CHANGELOG.md ] && grep -qE "^## \[?${VERSION//./\\.}\]?" CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## \\[?"v"\\]?" { found=1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > changelog.md
          else
            PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            if [ -n "$PREVIOUS" ]; then RANGE="$PREVIOUS..$GITHUB_REF_NAME"; else RANGE="$GITHUB_REF_NAME"; fi
            git log "$RANGE" --no-merges --pretty="- %s" > changelog.md
          fi
          if [ ! -s changelog.md ]; then echo "- Améliorations et corrections" > changelog.md; fi
          cat changelog.md

      - name: Publish GitHub Release
        if: env.IS_TAG == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Somna ${{ steps.version.outputs.name }}
          body_path: changelog.md
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
